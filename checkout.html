<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Verola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header page-header">
      <nav class="navbar dark-nav" aria-label="Primary navigation">
        <a class="brand" href="index.html">Verola</a>
        <div class="nav-links">
          <a href="products.html">Collections</a>
          <a href="products.html#featured-products">New In</a>
          <a href="payment.html">Payment</a>
        </div>
        <a
          class="cart-link"
          href="checkout.html"
          aria-label="Shopping bag with two products"
        >
          <span class="cart-icon" aria-hidden="true"></span>
          <span class="cart-count"></span>
        </a>
      </nav>
    </header>

    <main class="page-main">
      <section class="checkout-layout">
        <aside class="summary-card js-summary-card" aria-label="Order summary">
          <p class="eyebrow dark">Your Bag</p>
        </aside>
        <div class="checkout-panel">
          <p class="eyebrow dark">Secure Checkout</p>
          <h1>Delivery Details</h1>
          <form class="checkout-form" action="payment.html" method="get">
            <div class="form-grid">
              <label
                >First Name<input
                  type="text"
                  name="first-name"
                  placeholder="Amelia"
                  required
              /></label>
              <label
                >Last Name<input
                  type="text"
                  name="last-name"
                  placeholder="Stone"
                  required
              /></label>
              <label
                >Email<input
                  type="email"
                  name="email"
                  placeholder="amelia@email.com"
                  required
              /></label>
              <label
                >Phone<input
                  type="tel"
                  name="phone"
                  placeholder="+1 212 555 0198"
                  required
              /></label>
              <label class="full"
                >Address<input
                  type="text"
                  name="address"
                  placeholder="28 Madison Avenue"
                  required
              /></label>
              <label
                >City<input
                  type="text"
                  name="city"
                  placeholder="New York"
                  required
              /></label>
            </div>
            <button class="button button-dark form-button" type="submit">
              Continue to Payment
            </button>
          </form>
        </div>
      </section>
    </main>
    <script src="script/checkout.js" type="module"></script>
  </body>
</html>
